name: CI required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Load canonical manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: groups
        run: ./scripts/ci groups --github-output

  offline:
    name: Offline (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: manifest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python' || matrix.runtime == 'infra'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-eval.txt
            ingestion/requirements.txt

      - name: Install Python quality dependencies
        if: matrix.runtime == 'python' || matrix.runtime == 'infra'
        run: pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.runtime == 'node'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: hashicorp/setup-terraform@v3
        if: matrix.runtime == 'infra'
        with:
          terraform_version: 1.11.4

      - name: Initialize Terraform providers
        if: matrix.runtime == 'infra'
        working-directory: infra/terraform/gcp
        run: terraform init -backend=false -input=false

      - name: Run canonical offline group
        run: ./scripts/ci offline --group '${{ matrix.group }}'

  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: [manifest, offline]
    steps:
      - name: Require every canonical offline group
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: |
          if [ "$MANIFEST_RESULT" != success ] || [ "$OFFLINE_RESULT" != success ]; then
            echo "Canonical offline quality checks failed." >&2
            exit 1
          fi
          echo "All canonical offline quality groups passed."
