name: Live eval required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  PROJECT_ID: project-c170fa55-f0d5-4d83-bfe
  REGION: europe-west2
  STAGING_SERVICE: agent-backend-staging
  IMAGE: europe-west2-docker.pkg.dev/project-c170fa55-f0d5-4d83-bfe/agent-backend/agent-backend

concurrency:
  group: live-eval-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify live impact
    runs-on: ubuntu-latest
    outputs:
      ai-impact: ${{ steps.impact.outputs.ai-impact }}
      trusted: ${{ steps.impact.outputs.trusted }}
      trust-reason: ${{ steps.impact.outputs.trust-reason }}
      tree-sha: ${{ steps.tree.outputs.tree-sha }}
      commit-sha: ${{ steps.tree.outputs.commit-sha }}
      corpus-status: ${{ steps.corpus.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: impact
        run: ./scripts/ci impact --event-file "$GITHUB_EVENT_PATH" --github-output
      - id: tree
        run: |
          echo "tree-sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: corpus
        name: Resolve corpus approval state without installing dependencies
        run: |
          status="$(python3 -c 'import json; print(json.load(open("backend/eval/corpus/v1/cases.json"))["approval"]["status"])')"
          case "$status" in pending_human_review|approved) ;; *) echo "Invalid corpus approval status." >&2; exit 1 ;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

  fork-guidance:
    name: Fork live-eval guidance
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.ai-impact == 'true' && needs.classify.outputs.trusted != 'true'
    steps:
      - name: Explain trusted-branch requirement
        run: |
          echo "AI-impacting fork code cannot receive model, GCP, or staging database secrets." >&2
          echo "A maintainer must review the patch and copy it to a branch in this repository, then rerun the required checks." >&2
          echo "This workflow intentionally uses the non-privileged pull request event." >&2
          exit 1

  corpus-bootstrap-guidance:
    name: Pending corpus bootstrap guidance
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.ai-impact == 'true' && needs.classify.outputs.trusted == 'true' && needs.classify.outputs.corpus-status != 'approved'
    steps:
      - name: Explain the one-time bootstrap gate
        run: |
          echo "The reviewed semantic corpus is still pending. Protected PR model calls, browser installation, image builds, and staging mutation are intentionally skipped."
          echo "After this bootstrap change reaches main, manually dispatch the full Scheduled evaluation once to create the 20-case review artifacts."

  resolve-approved-tree:
    name: Resolve exact-tree approval
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.ai-impact == 'true' && needs.classify.outputs.trusted == 'true' && needs.classify.outputs.corpus-status == 'approved'
    environment: staging-eval
    permissions:
      contents: read
      id-token: write
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
      digest: ${{ steps.approval.outputs.digest }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: approval
        name: Resolve immutable digest for the approved tree
        env:
          TREE_SHA: ${{ needs.classify.outputs.tree-sha }}
        run: |
          approval_tag="$IMAGE:approved-tree-$TREE_SHA"
          error_file="$(mktemp)"
          if ! matches="$(gcloud artifacts docker tags list "$IMAGE" --filter="tag=\"$approval_tag\"" --format='value(version)' 2>"$error_file")"; then
            cat "$error_file" >&2
            echo "Approved-tree lookup failed; refusing to bypass protected evaluation." >&2
            exit 1
          fi
          rm -f "$error_file"
          if [ -z "$matches" ]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "No approval exists for exact tree $TREE_SHA; protected evaluation is required."
            exit 0
          fi
          mapfile -t versions < <(printf '%s\n' "$matches" | sed '/^$/d')
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "Exact approved-tree tag resolved to ${#versions[@]} versions; expected exactly one." >&2
            exit 1
          fi
          digest="${versions[0]##*/}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Approved-tree tag returned a malformed digest: $digest" >&2
            exit 1
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  evaluate:
    name: Protected staging browser and LLM evaluation
    runs-on: ubuntu-latest
    needs: [classify, resolve-approved-tree]
    if: needs.classify.outputs.ai-impact == 'true' && needs.classify.outputs.trusted == 'true' && needs.classify.outputs.corpus-status == 'approved' && needs.resolve-approved-tree.result == 'success' && needs.resolve-approved-tree.outputs.approved == 'false'
    # Browser time scales with reviewed corpus turns and is independently capped.
    # This outer timeout also covers setup, deployment, judging, and cleanup.
    timeout-minutes: 90
    environment: staging-eval
    concurrency:
      group: staging-live-eval-global
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize evaluation evidence directory
        run: mkdir -p artifacts/live-eval

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-eval.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install live evaluation dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-eval.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --prefer-offline --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Load isolated staging credentials
        run: |
          db_url="$(gcloud secrets versions access latest --secret=staging-supabase-db-url)"
          password="$(gcloud secrets versions access latest --secret=internal-test-password)"
          allowlist="$(gcloud secrets versions access latest --secret=internal-test-email-allowlist-raw)"
          email="$(printf '%s\n' "$allowlist" | tr ',;' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n1)"
          if [ -z "$db_url" ] || [ -z "$password" ] || [ -z "$email" ]; then
            echo "Protected staging credentials are incomplete." >&2
            exit 1
          fi
          echo "::add-mask::$db_url"
          echo "::add-mask::$password"
          echo "::add-mask::$email"
          {
            echo "SUPABASE_DB_URL=$db_url"
            echo "DB_SCHEMA=staging"
            echo "EVAL_INTERNAL_PASSWORD=$password"
            echo "EVAL_EMAIL=$email"
          } >> "$GITHUB_ENV"

      - name: Reset only the staging schema under an advisory lock
        run: python scripts/staging_database.py reset

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the tested tree once
        env:
          TREE_SHA: ${{ needs.classify.outputs.tree-sha }}
          COMMIT_SHA: ${{ needs.classify.outputs.commit-sha }}
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --tag "$IMAGE:$COMMIT_SHA" \
            --tag "$IMAGE:tree-$TREE_SHA" \
            --push .
          digest="$(gcloud artifacts docker images describe "$IMAGE:$COMMIT_SHA" --format='value(image_summary.digest)')"
          if [ -z "$digest" ]; then
            echo "Artifact Registry did not return an immutable digest." >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - id: deploy
        name: Deploy digest as a no-traffic staging revision
        env:
          REVISION_TAG: eval-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gcloud run deploy "$STAGING_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE@$IMAGE_DIGEST" \
            --no-traffic \
            --tag "$REVISION_TAG" \
            --timeout 420s \
            --update-env-vars ANTHROPIC_MAX_CONCURRENT_STREAMS=4,ANTHROPIC_PROMPT_CACHE_ENABLED=true \
            --quiet
          candidate_url="$(gcloud run services describe "$STAGING_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | python -c 'import json,os,sys; data=json.load(sys.stdin); tag=os.environ["REVISION_TAG"]; print(next((x.get("url", "") for x in data.get("status", {}).get("traffic", []) if x.get("tag") == tag), ""))')"
          if [ -z "$candidate_url" ]; then
            echo "Cloud Run did not expose the tagged candidate URL." >&2
            exit 1
          fi
          echo "CANDIDATE_URL=$candidate_url" >> "$GITHUB_ENV"
          echo "revision-tag=$REVISION_TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for candidate readiness
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$CANDIDATE_URL/api/prepare" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging candidate did not become ready." >&2
          exit 1

      - name: Start candidate-wired frontend
        run: |
          VITE_EVAL_AUTH_BOOTSTRAP=true VITE_API_PROXY_TARGET="$CANDIDATE_URL" npm --prefix frontend run dev -- --host localhost --port 5173 --strictPort > artifacts/live-eval/vite.log 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - id: browser
        name: Run eight real-browser journeys
        continue-on-error: true
        env:
          EVAL_BACKEND_URL: ${{ env.CANDIDATE_URL }}
        run: ./scripts/ci browser --suite pr --target http://localhost:5173 --output artifacts/live-eval/browser-results.json

      - id: semantic
        name: Apply deterministic and semantic rubrics
        if: always() && hashFiles('artifacts/live-eval/browser-results.json') != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_JUDGE_PROVIDER: anthropic
          EVAL_JUDGE_MODEL: claude-sonnet-5
        run: ./scripts/ci live --suite pr --target "$CANDIDATE_URL" --input artifacts/live-eval/browser-results.json --output artifacts/live-eval/live-results.json --require-approved-corpus --manual-review-policy report-only

      - name: Record deployment identity
        if: always()
        env:
          TREE_SHA: ${{ needs.classify.outputs.tree-sha }}
          COMMIT_SHA: ${{ needs.classify.outputs.commit-sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("artifacts/live-eval/deployment.json").write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "tree_sha": os.environ["TREE_SHA"],
              "image": os.environ["IMAGE"],
              "digest": os.environ.get("IMAGE_DIGEST", ""),
          }, indent=2) + "\n")
          PY

      - name: Remove ephemeral revision and image tags
        if: always()
        env:
          REVISION_TAG: ${{ steps.deploy.outputs.revision-tag }}
          TREE_SHA: ${{ needs.classify.outputs.tree-sha }}
          COMMIT_SHA: ${{ needs.classify.outputs.commit-sha }}
        run: |
          [ -z "${VITE_PID:-}" ] || kill "$VITE_PID" || true
          [ -z "$REVISION_TAG" ] || gcloud run services update-traffic "$STAGING_SERVICE" --project "$PROJECT_ID" --region "$REGION" --remove-tags "$REVISION_TAG" --quiet || true
          gcloud artifacts docker tags delete "$IMAGE:$COMMIT_SHA" --quiet || true
          gcloud artifacts docker tags delete "$IMAGE:tree-$TREE_SHA" --quiet || true

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-artifacts
          path: artifacts/live-eval
          retention-days: 30

      - name: Enforce evaluation result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
        run: |
          if [ "$BROWSER_OUTCOME" != success ] || [ "$SEMANTIC_OUTCOME" != success ]; then
            echo "Live evaluation failed, requires manual review, or hit an infrastructure error. See the 30-day artifacts." >&2
            exit 1
          fi

      - name: Publish exact-tree approval tag
        env:
          TREE_SHA: ${{ needs.classify.outputs.tree-sha }}
        run: gcloud artifacts docker tags add "$IMAGE@$IMAGE_DIGEST" "$IMAGE:approved-tree-$TREE_SHA" --quiet

  live-eval-required:
    name: Live eval required
    runs-on: ubuntu-latest
    if: always()
    needs: [classify, fork-guidance, corpus-bootstrap-guidance, resolve-approved-tree, evaluate]
    steps:
      - name: Resolve stable live-eval status
        env:
          AI_IMPACT: ${{ needs.classify.outputs.ai-impact }}
          TRUSTED: ${{ needs.classify.outputs.trusted }}
          CORPUS_STATUS: ${{ needs.classify.outputs.corpus-status }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          APPROVAL_RESULT: ${{ needs.resolve-approved-tree.result }}
          TREE_APPROVED: ${{ needs.resolve-approved-tree.outputs.approved }}
          EVAL_RESULT: ${{ needs.evaluate.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != success ]; then
            echo "Change classification failed." >&2
            exit 1
          fi
          if [ "$AI_IMPACT" != true ]; then
            echo "No AI-impacting paths changed; live model calls intentionally skipped."
            exit 0
          fi
          if [ "$TRUSTED" != true ]; then
            echo "AI-impacting fork PR requires maintainer review and a trusted branch." >&2
            exit 1
          fi
          if [ "$CORPUS_STATUS" != approved ]; then
            echo "Semantic corpus is pending review; protected live work is intentionally deferred to the one-time main bootstrap."
            exit 0
          fi
          if [ "$APPROVAL_RESULT" != success ]; then
            echo "Exact-tree approval lookup failed; protected evaluation cannot be bypassed." >&2
            exit 1
          fi
          if [ "$TREE_APPROVED" = true ]; then
            if [ "$EVAL_RESULT" != skipped ]; then
              echo "Exact-tree approval was found, but protected evaluation was not skipped." >&2
              exit 1
            fi
            echo "Exact tree already passed protected live evaluation; paid model calls intentionally skipped."
            exit 0
          fi
          if [ "$TREE_APPROVED" != false ]; then
            echo "Exact-tree approval lookup returned an invalid state." >&2
            exit 1
          fi
          if [ "$EVAL_RESULT" != success ]; then
            echo "Protected staging evaluation did not pass." >&2
            exit 1
          fi
          echo "Protected staging evaluation passed."
