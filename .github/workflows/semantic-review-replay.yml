name: Semantic review replay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful scheduled-evaluation run containing browser evidence
        required: true
        type: string
      source_commit_sha:
        description: Full application commit SHA recorded by the source run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: Replay semantic review only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install judge dependencies only
        run: pip install -r backend/requirements.txt
      - name: Download and authenticate immutable browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
        run: |
          case "$SOURCE_RUN_ID" in ''|*[!0-9]*) echo "Source run ID must be numeric." >&2; exit 1 ;; esac
          if ! printf '%s' "$SOURCE_COMMIT_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Source commit must be a full SHA." >&2
            exit 1
          fi
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          source_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)"
          source_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .path)"
          [ "$source_sha" = "$SOURCE_COMMIT_SHA" ] || { echo "Source run SHA mismatch." >&2; exit 1; }
          [ "$source_conclusion" = success ] || { echo "Source run was not successful." >&2; exit 1; }
          [ "$source_path" = .github/workflows/scheduled-eval.yml ] || { echo "Source is not a scheduled evaluation." >&2; exit 1; }
          if ! gh run download "$SOURCE_RUN_ID" \
            --name "scheduled-eval-replay-$SOURCE_RUN_ID" \
            --dir artifacts/source; then
            echo "Lightweight replay artifact predates this workflow; downloading the full evidence bundle."
            gh run download "$SOURCE_RUN_ID" \
              --name "scheduled-eval-$SOURCE_RUN_ID" \
              --dir artifacts/source
          fi
      - name: Validate deterministic source evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("artifacts/source")
          context = json.loads((source / "run-context.json").read_text(encoding="utf-8"))
          capture = json.loads((source / "browser-results.json").read_text(encoding="utf-8"))
          if context.get("run_id") != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("source artifact run ID mismatch")
          if context.get("commit_sha") != os.environ["SOURCE_COMMIT_SHA"]:
              raise SystemExit("source artifact commit mismatch")
          if capture.get("kind") != "browser_capture" or capture.get("suite") != "full":
              raise SystemExit("source artifact is not a full browser capture")
          failures = [result["id"] for result in capture.get("results", []) if not result.get("passed")]
          if len(capture.get("results", [])) != 20 or failures:
              raise SystemExit(f"source browser evidence is incomplete or failed: {failures}")
          replay = {
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_commit_sha": os.environ["SOURCE_COMMIT_SHA"],
              "judge_commit_sha": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
          }
          output = Path("artifacts/semantic-replay")
          output.mkdir(parents=True, exist_ok=True)
          (output / "replay-context.json").write_text(
              json.dumps(replay, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - id: judge
        name: Replay judge against saved browser evidence
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
        run: |
          target="$(python -c 'import json; print(json.load(open("artifacts/source/browser-results.json"))["backend_target"])')"
          ./scripts/ci live \
            --suite full \
            --target "$target" \
            --input artifacts/source/browser-results.json \
            --output artifacts/semantic-replay/live-results.json \
            --capture-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-replay-${{ github.run_id }}
          path: artifacts/semantic-replay
          retention-days: 30
      - name: Require judge infrastructure, preserve review outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/semantic-replay/live-results.json")
          if not report_path.exists():
              raise SystemExit("semantic replay did not produce a report")
          status = json.loads(report_path.read_text(encoding="utf-8")).get("status")
          if status == "infrastructure":
              raise SystemExit("semantic replay had an infrastructure failure")
          if status not in {"pass", "fail", "manual_review"}:
              raise SystemExit(f"semantic replay returned an unknown status: {status}")
          print(f"Semantic proposal status: {status}")
          PY
